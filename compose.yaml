services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gift_signal
      POSTGRES_USER: gift_signal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - gift_signal_pg:/var/lib/postgresql/data
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gift_signal -d gift_signal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - gift_signal_redis:/data

volumes:
  gift_signal_pg:
  gift_signal_redis:
