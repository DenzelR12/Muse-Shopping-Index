openapi: 3.1.0
info:
  title: Muse Shopping Index API
  version: 0.1.0
  description: Decision-grade gift recommendations and budget-aware bundle planning.
servers:
  - url: https://api.thegiftsignal.com
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { description: Service healthy }
  /v1/gifts/recommend:
    post:
      operationId: recommendGifts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200': { description: Ranked recommendations }
        '400': { description: Invalid request }
  /v1/bundles/build:
    post:
      operationId: buildGiftBundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200': { description: Budget-aware bundle plans }
        '400': { description: Invalid request }
components:
  schemas:
    GiftContext:
      type: object
      properties:
        recipient: { type: string }
        relationship: { type: string }
        occasion: { type: string }
        interests: { type: array, items: { type: string } }
        avoid: { type: array, items: { type: string } }
        budgetMin: { type: number, minimum: 0 }
        budgetMax: { type: number, exclusiveMinimum: 0 }
        hardBudget: { type: boolean }
        deliveryTier:
          type: string
          enum: [10_MIN, TOMORROW, 3_DAYS, THIS_WEEK, NO_RUSH]
        destinationCountry: { type: string }
    ProductCandidate:
      type: object
      required: [productId, title, price, currency, inStock, semanticIntents, useCases, recipientFit, occasionFit, bundleRoles]
      properties:
        productId: { type: string }
        title: { type: string }
        price: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        inStock: { type: boolean }
        semanticIntents: { type: array, items: { type: string } }
        useCases: { type: array, items: { type: string } }
        recipientFit: { type: array, items: { type: string } }
        occasionFit: { type: array, items: { type: string } }
        bundleRoles: { type: array, items: { type: string } }
        semanticSummary: { type: string }
        deliveryConfidence: { type: number, minimum: 0, maximum: 100 }
        semanticCompleteness: { type: number, minimum: 0, maximum: 100 }
    RecommendationRequest:
      type: object
      required: [context, candidates]
      properties:
        context: { $ref: '#/components/schemas/GiftContext' }
        candidates:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ProductCandidate' }
